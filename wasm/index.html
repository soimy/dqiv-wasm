<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Dragon Quest IV - wasm</title>
<style>
  html,body{height:100%;margin:0;background:#111;color:#ddd;overflow:hidden;
    font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
  /* SDL's emscripten driver reads the canvas's CSS size at creation and, if CSS
     is sizing it, uses that for the drawing buffer (times devicePixelRatio) and
     sends a resize event when it changes. So filling the page here is what makes
     browser resize drive the game, rather than the other way round. */
  #wrap{position:absolute;inset:0}
  canvas{width:100%;height:100%;display:block;background:#000}
  /* Once SDL sets a window size from the settings menu it takes over the canvas's
     CSS size, so the preset wins from then on; native/GameWindow.cpp clamps it to
     what the page can show. */
  #log{position:absolute;left:0;bottom:0;max-height:22%;overflow:auto;padding:6px;
    white-space:pre-wrap;background:rgba(0,0,0,.55);pointer-events:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="canvas" tabindex="0"></canvas></div>
<div id="log"></div>
<script>
// Mirror stdout, stderr and the console onto the page. The game reports its
// failures through std::cerr, which lands on console.error, so hooking only
// console.log would have shown a black screen and nothing else.
(function(){
  const log=document.getElementById('log');
  const flat=x=>{try{return typeof x==='object'?JSON.stringify(x):String(x)}catch(e){return String(x)}};
  const show=(level,s)=>{log.textContent+=(level==='log'?'':level.toUpperCase()+' ')+s+'\n';log.scrollTop=log.scrollHeight;};
  for(const level of ['log','info','warn','error']){
    const orig=console[level];
    console[level]=function(...a){show(level,a.map(flat).join(' '));return orig.apply(console,a);};
  }
  window.addEventListener('error',e=>show('error',e.message||e.type));
  // A wasm trap or an abort lands here as a rejected promise, and the message
  // alone ("unreachable") says nothing. The stack is the useful half.
  window.addEventListener('unhandledrejection',e=>{
    const r=e.reason;
    show('error','unhandled rejection: '+(r&&r.message||r));
    if(r&&r.stack)show('error',r.stack);
  });
  show('log','serving over http, canvas id="canvas" (SDL\'s default selector).');
})();
</script>
<script async src="dqiv_wasm_game.js"></script>
</body>
</html>
