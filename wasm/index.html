<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Dragon Quest IV - wasm</title>
<style>
  html,body{height:100%;margin:0;background:#111;color:#ddd;overflow:hidden;
    font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
  /* SDL's emscripten driver reads the canvas's CSS size at creation and, if CSS
     is sizing it, uses that for the drawing buffer (times devicePixelRatio) and
     sends a resize event when it changes. So filling the page here is what makes
     browser resize drive the game, rather than the other way round. */
  #wrap{position:absolute;inset:0}
  canvas{width:100%;height:100%;display:block;background:#000}
  /* Once SDL sets a window size from the settings menu it takes over the canvas's
     CSS size, so the preset wins from then on; native/GameWindow.cpp clamps it to
     what the page can show. */
  #log{position:absolute;left:0;bottom:0;max-height:22%;overflow:auto;padding:6px;
    white-space:pre-wrap;background:rgba(0,0,0,.55);pointer-events:none}
  #pick{position:absolute;left:0;top:0;padding:6px;background:rgba(0,0,0,.55);
    display:flex;gap:8px;align-items:center}
  #pick.hidden{display:none}
  /* The escape hatch for a save: the browser can lose its storage, and a 64 KiB file
     is the one copy the player can keep themselves. */
  #tools{position:absolute;right:0;bottom:0;padding:6px;background:rgba(0,0,0,.55);
    display:flex;gap:8px;font-size:12px;z-index:2}
  #tools a{color:#8cf}
  /* pre: the profile line below RAF/game is its own line, and a collapsed
     newline is how it looked like it had never arrived. */
  #fps{position:absolute;right:0;top:0;padding:6px;background:rgba(0,0,0,.55);
    pointer-events:none;color:#8f8;white-space:pre;text-align:right}
</style>
</head>
<body>
<div id="wrap"><canvas id="canvas" tabindex="0"></canvas></div>
<div id="log"></div>
<div id="tools"><a href="#" id="saveout" title="download the save file">save &#8595;</a>
  <a href="#" id="savein" title="upload a save file into this browser">save &#8593;</a>
  <input type="file" id="savefile" accept=".sav,*" hidden></div>
<div id="pick">
  <input type="file" id="rom" accept=".nds,*">
  <span id="romstate">pick the pack your machine built (or your own ROM) - the game reads it in place.
    Or <a href="#" id="norom">start without one</a> and it runs with an empty pack.
    The file is remembered after this, so the next visit starts straight away.</span>
</div>
<script>
// Mirror stdout, stderr and the console onto the page. The game reports its
// failures through std::cerr, which lands on console.error, so hooking only
// console.log would have shown a black screen and nothing else.
(function(){
  const log=document.getElementById('log');
  const flat=x=>{try{return typeof x==='object'?JSON.stringify(x):String(x)}catch(e){return String(x)}};
  // The game writes through std::cout, which lands in this node, and a session's worth
  // of that is megabytes of text: every append re-lays out the whole thing. Kept to the
  // last few thousand characters, which is all anyone reads from here.
  const show=(level,s)=>{
    log.textContent+=(level==='log'?'':level.toUpperCase()+' ')+s+'\n';
    if(log.textContent.length>20000)log.textContent=log.textContent.slice(-12000);
    log.scrollTop=log.scrollHeight;
  };
  for(const level of ['log','info','warn','error']){
    const orig=console[level];
    console[level]=function(...a){show(level,a.map(flat).join(' '));return orig.apply(console,a);};
  }
  window.addEventListener('error',e=>show('error',e.message||e.type));
  // A wasm trap or an abort lands here as a rejected promise, and the message
  // alone ("unreachable") says nothing. The stack is the useful half.
  window.addEventListener('unhandledrejection',e=>{
    const r=e.reason;
    show('error','unhandled rejection: '+(r&&r.message||r));
    if(r&&r.stack)show('error',r.stack);
  });
  show('log','serving over http, canvas id="canvas" (SDL\'s default selector).');
  // WebGL masks GL_RENDERER ("WebKit WebGL"), so whether the browser is on the GPU at
  // all is invisible from the game's own log. It decides what a frame time means: a
  // software fallback moves the 3D work onto the CPU and no amount of triangle
  // book-keeping explains the frame rate. The display rate matters the same way.
  (function(){
    try{
      const probe=document.createElement('canvas').getContext('webgl2');
      const info=probe&&probe.getExtension('WEBGL_debug_renderer_info');
      show('log','GPU: '+(info?probe.getParameter(info.UNMASKED_RENDERER_WEBGL):'(no WEBGL_debug_renderer_info)'));
      show('log','display: '+screen.width+'x'+screen.height+' css px, devicePixelRatio '+devicePixelRatio);
    }catch(e){show('log','GPU probe failed: '+e);}
  })();

  // The ROM has to be in the virtual filesystem before main() runs, so the page
  // owns the start: read the file, then load the script with a preRun that writes
  // it. preRun callbacks run before main, which is exactly the guarantee needed.
  // The ROM itself is still a per-visit pick (MEMFS); the saves are not.
  let romBytes=null;

  // Saves outlive the tab. Emscripten's IDBFS keeps a directory in IndexedDB: writes
  // stay in memory, FS.syncfs pushes them to storage, and the load at startup is
  // asynchronous - so the game waits for the callback before it reads anything (it
  // sleeps in main until dqiv_savesReady arrives). No COOP/COEP is involved: that
  // requirement belongs to SharedArrayBuffer, which this single-threaded build does
  // not use.
  let syncTimer=0;
  window.__syncSaves=function(){
    clearTimeout(syncTimer);
    syncTimer=setTimeout(function(){
      FS.syncfs(false,function(err){if(err)show('err','save not stored: '+err);});
    },250);
  };
  addEventListener('pagehide',function(){FS.syncfs(false,function(){});});

  // The ROM is 128 MB, and choosing it out of a file dialog on every reload is the
  // difference between a game and a build tool. Kept in IndexedDB as a Blob (the
  // structured clone of a Blob does not copy the bytes the way an ArrayBuffer does).
  // index.html?pick=1 skips the remembered one, for a ROM that does not boot.
  const ROM_DB='dqiv-rom',ROM_STORE='rom',ROM_KEY='pack';
  const romDb=()=>new Promise((res,rej)=>{
    const r=indexedDB.open(ROM_DB,1);
    r.onupgradeneeded=()=>r.result.createObjectStore(ROM_STORE);
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
  const romGet=async()=>{const db=await romDb();return new Promise((res,rej)=>{
    const t=db.transaction(ROM_STORE,'readonly').objectStore(ROM_STORE).get(ROM_KEY);
    t.onsuccess=()=>res(t.result||null);t.onerror=()=>rej(t.error);});};
  const romPut=async blob=>{const db=await romDb();return new Promise((res,rej)=>{
    const tx=db.transaction(ROM_STORE,'readwrite');tx.objectStore(ROM_STORE).put(blob,ROM_KEY);
    tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});};
  const romState=document.getElementById('romstate');
  const showPicker=text=>{
    document.getElementById('pick').classList.remove('hidden');
    romState.textContent=text;
  };

  const start=()=>{
    document.getElementById('pick').classList.add('hidden');
    window.Module={preRun:[function(){
      if(romBytes) FS.writeFile('/pack',new Uint8Array(romBytes));
      // A failure here must not take the game with it: without the mount the run
      // still works, it just cannot keep anything.
      try{
        try{FS.mkdir('/saves');}catch(e){if(e.errno!==20)throw e;}
        FS.mount(IDBFS,{},'/saves');
        FS.syncfs(true,function(err){
          if(err)show('err','saves could not be read: '+err);
          else show('log','saves: read from IndexedDB');
          window.Module._dqiv_savesReady();
        });
      }catch(e){
        show('err','saves will not be kept: '+e);
        window.Module._dqiv_savesReady();
      }
    }]};
    const s=document.createElement('script');s.src='dqiv_wasm_game.js';document.body.appendChild(s);
  };
  document.getElementById('rom').addEventListener('change',async e=>{
    const f=e.target.files[0];if(!f)return;
    try{await romPut(f);show('log','ROM remembered ('+Math.round(f.size/1048576)+' MB) - next visit starts without this dialog');}
    catch(err){show('err','ROM not remembered: '+err);}
    romBytes=await f.arrayBuffer();start();
  });
  document.getElementById('norom').addEventListener('click',e=>{e.preventDefault();start();});

  // Pointer input straight to the game. SDL's browser backend registers its mouse
  // handlers without a target element here, so the mouse focus it insists on before it
  // will report a button is never set and every click is dropped - verified by calling
  // its handler directly and watching no SDL event appear. Browsers deliver touch as
  // pointer events too, so this covers both. Coordinates are CSS pixels over the canvas,
  // which is what the game's own mouse path expects.
  (function(){
    const canvas=document.getElementById('canvas');
    let held=false;
    const send=(down,e)=>{
      if(!window.Module||!Module._dqiv_pointer)return;
      const r=canvas.getBoundingClientRect();
      Module._dqiv_pointer(down?1:0,e.clientX-r.left,e.clientY-r.top);
    };
    canvas.addEventListener('pointerdown',e=>{held=true;if(canvas.setPointerCapture)canvas.setPointerCapture(e.pointerId);send(true,e);e.preventDefault();});
    canvas.addEventListener('pointermove',e=>{if(held)send(true,e);});
    canvas.addEventListener('pointerup',e=>{held=false;send(false,e);});
    canvas.addEventListener('pointercancel',e=>{held=false;send(false,e);});
    canvas.addEventListener('pointerleave',e=>{if(held&&!canvas.hasPointerCapture)send(false,e);});
  })();

  // Export and import the save file. The game keeps it at /saves/dqiv_eur.sav; the
  // import path only writes the file, so the page asks for a reload afterwards (the
  // game has the old bytes in memory).
  const savePath='/saves/dqiv_eur.sav';
  document.getElementById('saveout').addEventListener('click',e=>{
    e.preventDefault();
    try{
      const bytes=FS.readFile(savePath);
      const a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([bytes],{type:'application/octet-stream'}));
      a.download='dqiv_eur.sav';a.click();URL.revokeObjectURL(a.href);
    }catch(err){show('err','no save file yet: '+err);}
  });
  document.getElementById('savein').addEventListener('click',e=>{
    e.preventDefault();document.getElementById('savefile').click();
  });
  document.getElementById('savefile').addEventListener('change',async e=>{
    const f=e.target.files[0];if(!f)return;
    try{
      FS.writeFile(savePath,new Uint8Array(await f.arrayBuffer()));
      FS.syncfs(false,function(err){show(err?'err':'log',err?'save not stored: '+err:'save imported - reload the page to use it');});
    }catch(err){show('err','save not imported: '+err);}
  });

  (async function(){
    if(location.search.includes('pick'))return;
    let blob=null;
    try{blob=await romGet();}catch(e){show('log','ROM memory unavailable: '+e);}
    if(!blob)return;
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
    romState.textContent='remembered ROM ('+Math.round(blob.size/1048576)+' MB) - starting';
    try{romBytes=await blob.arrayBuffer();}catch(e){showPicker('the stored ROM could not be read: '+e);return;}
    start();
    // A remembered ROM that never gets the game to its first frames is almost
    // certainly not this game's: hand the picker back instead of trapping the page.
    setTimeout(function(){
      if(!window.__gameSteps)showPicker('that ROM did not start the game - pick another one (it replaces the stored copy).');
    },45000);
  })();
})();
// Frame-rate overlay, asked for: the eye said it is not 60, so the number goes where
// both of us can read it. RAF is what the display actually gets; the game's own step
// rate is pushed here by wasm, which knows what it counts a frame to be.
(function(){
  const d=document.createElement('div');d.id='fps';document.body.appendChild(d);
  let frames=0;const tick=()=>{frames++;requestAnimationFrame(tick);};requestAnimationFrame(tick);
  setInterval(()=>{
    const g=window.__gameSteps;
    d.textContent='RAF '+frames+' Hz | game '+(g!=null?g:'?')+' steps/s'+
      (window.__profile?'\n'+window.__profile:'')+
      (window.__gaps?'\n'+window.__gaps:'')+
      (window.__diag?'\n'+window.__diag:'');
    frames=0;
  },1000);
})();
// 1-4 switch a render stage off while the game runs: the frame rate then says what
// that stage costs on this machine, which is the one thing a headless build cannot
// answer for a real GPU. Pressing the same key again puts it back.
(function(){
  const names={1:'present',2:'3D',3:'readback',4:'upload'};
  const off=new Set();
  addEventListener('keydown',e=>{
    const n=parseInt(e.key,10);
    if(!(n>=1&&n<=4)||!window.Module||!Module._dqiv_toggle)return;
    e.preventDefault();
    Module._dqiv_toggle(n);
    off.has(n)?off.delete(n):off.add(n);
    window.__diag=off.size?'off: '+[...off].map(x=>names[x]).join(' + '):'';
  },true);
})();
// F10 saves the journal the game wrote, so the numbers behind a bad frame rate can
// be read here instead of in DevTools. The file lives in the page's memory (MEMFS),
// so this is the only way out of the browser without opening the console.
(function(){
  addEventListener('keydown',e=>{
    if(e.key!=='F10')return;
    e.preventDefault();
    try{
      const bytes=FS.readFile('/tmp/journal.txt');
      const a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([bytes],{type:'text/plain'}));
      a.download='journal.txt';a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),10000);
    }catch(err){console.error('journal not available: '+err);}
  },true);
})();
</script>
</body>
</html>
