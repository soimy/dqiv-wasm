name: ci

on:
  push:
    branches: [wasm, main]
  pull_request:
    branches: [wasm, main]

jobs:
  # The upstream Windows build. This is the only place that can honestly hold the
  # M2 acceptance criterion "the Windows build is still 0 error" — nobody working
  # on a Mac has a Win32/MSVC toolchain, so the claim needs a machine that does.
  windows:
    # Pinned, not windows-latest: as of Oct 2026 that label resolves to
    # windows-2025-vs2026, which ships Visual Studio 2026 only, and the
    # windows-game preset hard-codes the "Visual Studio 17 2022" generator.
    # windows-2025 also resolves there now, so neither label can run the
    # preset. windows-2022 is the label that still matches the generator
    # name; if GitHub retires it, this job moves to the VS 2026 generator
    # (or Ninja + MSVC).
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain probe
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -prerelease -products * -format json |
            ConvertFrom-Json |
            ForEach-Object { "$($_.installationName) | $($_.installationVersion) | $($_.installationPath)" }
      - name: Configure
        run: cmake --preset windows-game
      - name: Build
        run: cmake --build build32 --config Release

  # The wasm32 cross-build, plus the two assertions the M1 spike was verified with.
  # Emscripten is pinned to the release the port was verified against.
  wasm:
    runs-on: ubuntu-latest
    # The whole decompiled game plus the platform layer, then a 23 MB wasm link.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install emsdk
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install 4.0.13
          ./emsdk activate 4.0.13
      - name: Build
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          ./wasm/build.sh
      - name: Check the decompiled game still runs
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          out=$(node wasm/build/dqiv_wasm_spike.js)
          echo "$out"
          echo "$out" | grep -q 'arrayToIndex(\[1,1,1,1\], value=3, max=4) = 3'
      - name: Check the 32-bit layout assumptions still hold
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          out=$(node wasm/build/dqiv_layout_probe.js)
          echo "$out"
          echo "$out" | grep -q 'sizeof(void\*)        = 4'
          echo "$out" | grep -q 'sizeof(DataObject)   = 0x10'
          echo "$out" | grep -q 'sizeof(UnkGameApplication) = 0xb4'
          echo "$out" | grep -q 'sizeof(OSThread)     = 0xc0'
          # Byte order is the change most likely to be silently wrong, so the
          # round trip is pinned to the exact values, not just to "ok".
          echo "$out" | grep -q 'byte order         = 0x7f3a5c6e -> 0x7f6e5c3a -> 0x7f3a5c6e  ok'
      - name: Check the shaders against both GLSL profiles
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          python3 wasm/check-shaders.py
      - name: Check the real game gets through startup to the GL boundary
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          # What node can actually prove, measured rather than assumed. It has no
          # window and no WebGL, so it stops inside SDL video init and exits
          # non-zero on the uncaught exception. Reaching SDL_VideoInit is the
          # point: GameWindow gets there through openResources(), so this step
          # proves the static-init order holds and the startup runs. It cannot
          # prove anything past the GL boundary - that needs a real browser, and
          # the self-check's answers (byte order, clip) live in the browser.
          out=$(node wasm/build/dqiv_wasm_game.js 2>&1 || true)
          echo "$out" | grep -q 'SDL_VideoInit'
          echo "$out" | grep -q 'Emscripten_CreateDevice'
          echo "$out" | grep -q 'window is not defined'
